name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Test and Build Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend_notifications

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notifications

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend_notifications/package-lock.json

      - name: Use project npm version
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run lint
        run: npm run lint:check

      - name: Run unit tests
        run: npm run test:unit

      - name: Build backend
        run: npm run build     
